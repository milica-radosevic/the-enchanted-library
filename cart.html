<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | The Enchanted Library</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="cart-page">

    <header>
        <h1>Your Cart</h1>
        <p>Your next magical read awaits.</p>
    </header>

    <nav>
        <a href="index.html" class="back-button"
           aria-label="Go back"
           onclick="if (history.length > 1) { history.back(); return false; }">
            &larr;
        </a>

        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart</a>
    </nav>

    <main class="cart-container">

        <h2>Your Books</h2>

        <div id="cart-items">
            <p>Your cart is currently empty.</p>
        </div>

        <div class="cart-total">
            <h3>Total: <span id="cart-total">0€</span></h3>
        </div>

        <div class="cart-buttons">

            <a href="index.html" class="view-button">
                Continue Shopping
            </a>

            <a href="checkout.html" class="view-button checkout-button">
                Proceed to Checkout
            </a>

        </div>

    </main>

    <footer>
        <p class="footer-title">The Enchanted Library</p>
        <p>Where every book opens a new world.</p>
        <p>&copy; 2026 The Enchanted Library</p>
    </footer>


<script src="js/cart.js"></script>    
</body>

</html>
